<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC-Server - Central Brain Login</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom Palette: Black, Blue, and White */
        body {
            background-color: #0f111a; /* Deep tech black */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: #161925; /* Dark ash contrast */
            border: 1px solid #1f2438;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* Logo Brand Style */
        .brand-logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc); /* High-tech corporate blues */
            color: #ffffff;
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: 2px;
            padding: 0.2rem 1.5rem;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(67, 100, 247, 0.3);
        }

        .brand-sub {
            color: #a0aec0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0.5rem;
        }

        /* Form Styling */
        .form-control {
            background-color: #0f111a;
            border: 1px solid #2d3748;
            color: #ffffff;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            background-color: #0f111a;
            border-color: #4364f7;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(67, 100, 247, 0.25);
        }

        .form-label {
            color: #cbd5e0;
            font-weight: 500;
        }

        .btn-primary-custom {
            background-color: #4364f7;
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background-color: #0052d4;
            box-shadow: 0 4px 12px rgba(0, 82, 212, 0.4);
        }

        .error-banner {
            background-color: rgba(229, 62, 62, 0.2);
            border: 1px solid #e53e3e;
            color: #fc8181;
            font-size: 0.9rem;
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo Header Section -->
        <!-- Logo Header Section with Image -->
    <div class="brand-logo-container">
         <!-- The image will be served from our static folder -->
         <img src="/static/img/logo-imc.png" alt="IMC-Server" class="mb-2" style="max-height: 80px; width: auto;">
         <div class="brand-sub" style="color: #a0aec0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px;">IMC-Server</div>
    </div>

        <!-- Simulated Error Handling via Query Parameters -->
        <div id="error-div" class="error-banner" style="display: none;">
            Invalid username or password. Please try again.
        </div>

        <!-- Login Form -->
        <form action="/login" method="POST">
            <input type="hidden" name="redirect" id="redirect-input" value="">
            <div class="mb-3">
                <label for="username" class="form-label">E-mail Corporativo ou Login</label>
                 <input type="text" class="form-control" id="username" name="username" placeholder="exemplo@imcserver.com ou login" required autocomplete="username">
           </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 rounded">Entrar</button>
            <div class="text-center mt-3" style="font-size: 0.7rem; color: #718096; letter-spacing: 1px;">
                Versão v1.5.0 - SONIC
            </div>
        </form>
    </div>

    <script>
        // Client-side detection for error parameters in the URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'invalid') {
            document.getElementById('error-div').style.display = 'block';
        }
        const redirectParam = urlParams.get('redirect');
        if (redirectParam) {
            document.getElementById('redirect-input').value = redirectParam;
        }
    </script>
</body>
</html>
